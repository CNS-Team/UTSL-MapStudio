name: Source boundary and GUI build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  gui-and-source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check publishable source boundary
        shell: pwsh
        run: ./scripts/Test-SourceSafety.ps1 | ConvertTo-Json -Depth 5
      - name: Build GUI only (no private engine available)
        shell: pwsh
        run: dotnet build src/Studio/Studio.csproj -c Release -o studio -p:RestoreLockedMode=true --nologo
